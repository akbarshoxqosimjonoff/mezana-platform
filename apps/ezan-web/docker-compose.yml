services:
  postgres:
    image: postgres:16-alpine
    container_name: ezan_web_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ezan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezan_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ezan_web}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - ezan_web_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ezan_user} -d $${POSTGRES_DB:-ezan_web}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: elestio/minio:latest
    container_name: ezan_web_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ezan_web_minio_data:/data

volumes:
  ezan_web_pgdata:
  ezan_web_minio_data:
