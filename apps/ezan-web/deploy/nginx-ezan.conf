# Ezan Vakfı — Nginx Production Konfiguratsiyasi (Cloudflare Origin SSL + Real IP)
# Ikkala domen: ezanvakfi.org va azonvaqfi.org

# Faqat Cloudflare IP diapazonlaridan kelgan CF-Connecting-IP ga ishoniladi
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# www -> non-www 301 redirect
server {
    listen 443 ssl http2;
    server_name www.ezanvakfi.org;
    ssl_certificate /etc/ssl/cloudflare/ezan-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ezan-origin.key;
    return 301 https://ezanvakfi.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.azonvaqfi.org;
    ssl_certificate /etc/ssl/cloudflare/ezan-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ezan-origin.key;
    return 301 https://azonvaqfi.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ezanvakfi.org azonvaqfi.org;

    ssl_certificate /etc/ssl/cloudflare/ezan-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ezan-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # HSTS (Dastlab 1 hafta = 604800, 1 haftadan keyin 31536000)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Statik fayllar uzoq keshlanadi
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API, admin, dala va kabinet hech qachon keshlanmaydi
    location ~ ^/(api|admin|dala|tr/hesabim|uz/kabinet|en/account|ar/account) {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }
}
