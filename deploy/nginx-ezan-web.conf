# Cloudflare Origin SSL + Dual-domain (ezanvakfi.org & azonvaqfi.org) Nginx Configuration

server {
    listen 80;
    server_name ezanvakfi.org www.ezanvakfi.org azonvaqfi.org www.azonvaqfi.org;
    return 301 https://$host$request_uri;
}

# www -> non-www 301 redirect
server {
    listen 443 ssl http2;
    server_name www.ezanvakfi.org;

    ssl_certificate     /etc/ssl/cloudflare/ezanvakfi.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ezanvakfi.key;

    return 301 https://ezanvakfi.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.azonvaqfi.org;

    ssl_certificate     /etc/ssl/cloudflare/azonvaqfi.pem;
    ssl_certificate_key /etc/ssl/cloudflare/azonvaqfi.key;

    return 301 https://azonvaqfi.org$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ezanvakfi.org azonvaqfi.org;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Static assets long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Next.js + Payload app on port 3005
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_cache_bypass $http_upgrade;
    }
}